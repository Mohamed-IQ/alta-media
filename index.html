<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألتا ميديا | شبكة التوزيع والانتشار الذكي</title>
    <!-- استيراد تصميم Bootstrap الأنيق -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .btn-custom { background-color: #3b82f6; color: white; font-weight: bold; }
        .btn-custom:hover { background-color: #2563eb; color: white; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-primary">Alta Media</h1>
                    <p class="text-muted">منصة التوزيع الذكي لإطلاق المحتوى وتحريك الخوارزميات</p>
                </div>

                <div class="card p-4 shadow-lg">
                    <form action="/submit" method="POST">
                        <div class="mb-3">
                            <label for="tiktok_url" class="form-label">أدخل رابط فيديو تيك توك الخاص بك:</label>
                            <input type="url" class="form-control bg-dark text-light border-secondary" id="tiktok_url" name="tiktok_url" placeholder="https://www.tiktok.com/@user/video/..." required>
                        </div>
                        <button type="submit" class="btn btn-custom w-100 py-2">بدء التوزيع الفوري 🚀</button>
                    </form>

                    {% if success %}
                        <div class="alert alert-success mt-3 text-center" role="alert">
                            تم إرسال الرابط بنجاح! جاري توليد إشارات الويب وتوزيع المحتوى لإشعار الخوارزميات.
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
